<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b66"><title>Etiqueta Digital</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f2f5f8;color:#17202a}.wrap{max-width:680px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 10px #0001;margin-top:24px}h1{color:#123b66}.big{font-size:28px;font-weight:800;color:#123b66;word-break:break-word}.muted{color:#68747e}.warn{background:#fff5dc;color:#795600;padding:12px;border-radius:10px;margin-top:18px}</style></head><body><div class="wrap"><div class="card"><h1>🏷️ Etiqueta Digital</h1><div id="content"></div></div></div><script>const id=new URLSearchParams(location.search).get('id')||'';let reg={};try{reg=JSON.parse(localStorage.getItem('coilFinderTagRegistryV1')||'{}')}catch(e){};const item=Object.values(reg).find(x=>x.tagId===id);const box=document.getElementById('content');if(item){box.innerHTML=`<div class="muted">Coil Number</div><div class="big">${item.coil}</div><div class="muted" style="margin-top:16px">BL</div><div class="big">${item.bl||'—'}</div><div class="muted" style="margin-top:16px">ID digital</div><div>${item.tagId}</div><div class="warn">Página provisória para validar o vínculo NFC/QR. A versão completa da Etiqueta Digital será criada na próxima etapa.</div>`}else{box.innerHTML=`<div class="warn">Registro ${id||'não informado'} não foi encontrado neste navegador. Nesta versão de teste, o cadastro ainda é local. A etapa de servidor/banco central será necessária para abrir a etiqueta em qualquer aparelho.</div>`}</script></body></html>
